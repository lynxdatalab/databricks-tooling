# Workflow reutilizable: despliega un Databricks Asset Bundle a UN target.
#
# Se llama una vez por ambiente desde el workflow de despliegue del repo, encadenando los jobs con
# `needs:` para que la promoción sea dev → qa → prod. Las compuertas de aprobación NO viven aquí:
# viven en las protection rules del GitHub Environment, que es donde el equipo puede cambiarlas sin
# tocar código.
#
# ⚠️ El análisis de acciones destructivas NO va aquí, y no es un olvido: GitHub evalúa las
# protection rules del environment ANTES de ejecutar un solo paso del job, así que un job con
# `environment: qa` se detiene sin haber podido imprimir nada. El revisor no vería el análisis.
# Por eso vive en bundle-analyze.yml, que corre sin environment y publica su resumen primero.
#
# Uso desde el repo llamador:
#
#   jobs:
#     analizar:
#       uses: <org>/databricks-tooling/.github/workflows/bundle-analyze.yml@v1
#     dev:
#       needs: analizar
#       uses: <org>/databricks-tooling/.github/workflows/bundle-deploy.yml@v1
#       permissions: { id-token: write, contents: read }
#       with: { target: dev }

name: bundle-deploy

on:
  workflow_call:
    inputs:
      target:
        description: Target del bundle. Debe existir un GitHub Environment con el mismo nombre.
        type: string
        required: true
      python-version:
        type: string
        default: "3.11"
      docs:
        description: >-
          Dónde documenta este repo las alternativas a destruir. Se cita en el mensaje de fallo.
          Este workflow no puede saber el layout de docs del consumidor.
        type: string
        default: "la documentación de acciones destructivas del repo"
      allow-destructive:
        description: >-
          Autoriza al CLI a ejecutar cambios que BORRAN datos: recrear un pipeline (cambio de
          catalog/schema/publishing mode) o eliminarlo (clave renombrada, recurso quitado). Al
          borrarse un pipeline se borran sus materialized views y streaming tables.

          Default false, y en el push automático a main debe quedarse en false: nadie destruye
          datos por hacer merge. Se activa solo desde workflow_dispatch, después de revisar el
          resumen del job `analizar` de esa misma corrida.
        type: boolean
        default: false
      dry-run:
        description: >-
          Valida y muestra el estado desplegado sin aplicar nada. Sirve para inspeccionar qué hay
          hoy en un ambiente antes de tocarlo.
        type: boolean
        default: false
      bundle-vars:
        description: >-
          Variables del bundle que no viven en databricks.yml, una por línea, en formato
          `nombre=valor`. Se exportan como BUNDLE_VAR_<nombre>, que es como el CLI las lee.

          Existe porque hay valores de OPERACIÓN —el correo de alertas es el caso— que cambian sin
          que cambie el repo, y que por eso se declaran sin default: un default vacío produce un
          lote que falla de madrugada sin que nadie se entere. Sin un canal para pasarlos, el
          `bundle validate` del CI falla con "no value assigned to required variable".

          El mapeo es explícito y no automático porque GitHub guarda los nombres de sus variables
          en MAYÚSCULAS, y las variables del bundle son sensibles a mayúsculas: una copia directa
          exportaría BUNDLE_VAR_NOTIFICATION_EMAIL, que el CLI no reconoce.

          El llamador escribe una línea por variable, con el valor interpolado desde el contexto
          `vars` de su GitHub Environment. Ver el README.
        type: string
        default: ""
    outputs:
      commit:
        description: SHA desplegado. Sirve para verificar que los tres ambientes corren el mismo.
        value: ${{ jobs.deploy.outputs.commit }}

jobs:
  deploy:
    # El nombre del job es lo que GitHub muestra en el DIÁLOGO DE APROBACIÓN del environment, antes
    # de que el revisor abra nada. Marcarlo aquí es lo que hace que una aprobación destructiva no se
    # pueda confundir con una rutinaria.
    name: deploy ${{ inputs.target }}${{ inputs.allow-destructive && ' ⚠️ DESTRUCTIVO' || '' }}
    runs-on: ubuntu-latest

    # Aquí está el control de acceso real. El environment aporta tres cosas a la vez:
    #   1. Sus protection rules (required reviewers, deployment branches) — el job SE DETIENE
    #      esperando aprobación antes de correr un solo paso.
    #   2. Las variables DATABRICKS_HOST y DATABRICKS_CLIENT_ID de ese ambiente.
    #   3. El claim `sub = repo:{org}/{repo}:environment:{target}` del token OIDC, que es el único
    #      que la federation policy del service principal de ese ambiente acepta.
    # Las tres son independientes: saltarse una no basta para desplegar a prod.
    environment: ${{ inputs.target }}

    outputs:
      commit: ${{ github.sha }}

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      # Sin DATABRICKS_CLIENT_SECRET: la CLI usa el token OIDC efímero que emite GitHub y que la
      # federation policy del service principal canjea por acceso.

    steps:
      - uses: actions/checkout@v4

      # Fijo, no @main: es la misma regla que este repo le impone a sus consumidores.
      - uses: databricks/setup-cli@v1.11.0

      # Lo usa el resumen del estado desplegado. Sin esto, `python-version` era un input muerto que
      # se leía como configurado.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Verificar configuración del environment
        # Un DATABRICKS_CLIENT_ID vacío hace que la CLI caiga a otro método de autenticación y
        # falle mucho después con un error de credenciales que no dice que la variable faltaba.
        run: |
          : "${DATABRICKS_HOST:?falta la variable DATABRICKS_HOST en el GitHub Environment '${{ inputs.target }}'}"
          : "${DATABRICKS_CLIENT_ID:?falta la variable DATABRICKS_CLIENT_ID en el GitHub Environment '${{ inputs.target }}'}"
          echo "Desplegando ${{ github.sha }} a ${{ inputs.target }} ($DATABRICKS_HOST)"

      # Se exportan al entorno del job (GITHUB_ENV) y no en cada `run:` porque las consumen tres
      # pasos distintos: validate, summary y deploy. Que uno las tuviera y otro no produciría un
      # validate en verde seguido de un deploy que falla por una variable sin valor.
      - name: Exportar variables del bundle
        if: inputs.bundle-vars != ''
        env:
          BUNDLE_VARS: ${{ inputs.bundle-vars }}
        run: |
          set -euo pipefail
          while IFS= read -r linea; do
            [ -z "${linea// }" ] && continue
            case "$linea" in \#*) continue ;; esac
            nombre=${linea%%=*}
            valor=${linea#*=}
            nombre=$(printf '%s' "$nombre" | tr -d '[:space:]')
            if [ -z "$nombre" ] || [ "$nombre" = "$linea" ]; then
              echo "::error::bundle-vars: '$linea' no tiene forma nombre=valor" && exit 1
            fi
            # El valor NO se recorta ni se imprime: puede traer espacios significativos, y un
            # echo aquí lo dejaría en el log de una corrida pública.
            printf 'BUNDLE_VAR_%s=%s\n' "$nombre" "$valor" >> "$GITHUB_ENV"
            echo "  BUNDLE_VAR_$nombre exportada"
          done <<< "$BUNDLE_VARS"

      - name: databricks bundle validate
        run: databricks bundle validate -t ${{ inputs.target }}

      - name: Estado desplegado antes del cambio
        # `bundle summary` lista los recursos que hoy existen en el workspace para este target.
        # No es un plan —el CLI no tiene `bundle plan`— pero es la foto del "antes", y queda en el
        # log de la corrida para poder comparar si algo sale mal.
        continue-on-error: true
        run: |
          databricks bundle summary -t ${{ inputs.target }} -o json > /tmp/antes.json || true
          echo "Recursos desplegados actualmente:"
          python -c "
          import json, pathlib, sys
          p = pathlib.Path('/tmp/antes.json')
          if not p.stat().st_size:
              print('  (ninguno: primer despliegue a este target)'); sys.exit()
          d = json.loads(p.read_text()).get('resources', {})
          for tipo, items in sorted(d.items()):
              for clave in sorted(items):
                  print(f'  {tipo}.{clave}')
          " || echo "  (no se pudo leer el resumen)"

      - name: databricks bundle deploy
        id: deploy
        if: ${{ !inputs.dry-run }}
        # --auto-approve SOLO cuando alguien lo autorizó explícitamente. Sin él, el CLI intenta
        # pedir confirmación para los cambios destructivos, no hay terminal que responda, y el job
        # falla. Ese fail-closed es el diseño: el paso siguiente traduce el error.
        run: |
          databricks bundle deploy -t ${{ inputs.target }} \
            ${{ inputs.allow-destructive && '--auto-approve' || '' }}

      - name: El deploy requiere aprobar una acción destructiva
        # Acotado al paso del deploy: con `failure()` a secas, un fallo de red, de checkout o de
        # `bundle validate` producía este mismo mensaje y mandaba a buscar una destrucción que no
        # existía.
        # `failure()` va al frente a propósito: sin una función de estado en la expresión, GitHub
        # aplica `success()` implícito y el paso se omitiría justo cuando hace falta.
        if: ${{ failure() && steps.deploy.outcome == 'failure' && !inputs.allow-destructive }}
        run: |
          {
            echo "### ⛔ Despliegue detenido a \`${{ inputs.target }}\`"
            echo ""
            echo "Es probable que el cambio **borre o recree recursos**, y este despliegue corre en"
            echo "modo cerrado. Al recrearse un pipeline se borran sus materialized views y"
            echo "streaming tables."
            echo ""
            echo "**Qué hacer:**"
            echo ""
            echo "1. Revisa el resumen del job \`analizar\` de esta misma corrida: dice exactamente"
            echo "   qué se destruiría."
            echo "2. Si NO era la intención, revisa ${{ inputs.docs }} — casi siempre"
            echo "   hay una maniobra que evita destruir (\`bundle deployment bind\` para renombrar"
            echo "   sin recrear, \`ALTER ... pipelines.pipelineId\` para mover tablas)."
            echo "3. Si SÍ era la intención, relanza el workflow \`deploy\` con **Run workflow** y"
            echo "   marca \`allow-destructive\`."
            echo ""
            echo "> Si el error de arriba no menciona aprobación ni recreación, el fallo es otro:"
            echo "> revisa el log del paso \`databricks bundle deploy\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::El despliegue puede requerir aprobar una acción destructiva. Ver el resumen de la corrida."

      - name: Resumen
        if: ${{ always() }}
        run: |
          {
            echo "### Deploy a \`${{ inputs.target }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Workspace | ${{ vars.DATABRICKS_HOST }} |"
            echo "| Modo | ${{ inputs.dry-run && 'dry-run (sin aplicar)' || 'aplicado' }} |"
            echo "| Destructivos | ${{ inputs.allow-destructive && '⚠️ AUTORIZADOS' || 'bloqueados' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
