# CI de ESTE repo.
#
# Existía un hueco incómodo: los workflows de aquí se publican con un tag móvil `v1` que todos los
# repos de lakehouse siguen, pero nada los probaba. La única forma de enterarse de que un cambio
# rompía algo era que fallara el deploy a producción de un proyecto que nadie estaba mirando.
#
# Las compuertas son código con pruebas, así que aquí se prueban como código.

name: self-test

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: lint + pruebas (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Las dos puntas del rango que declara pyproject. El CI de los repos consumidores corre con
        # `python-version` configurable, así que romper una de las dos rompe a alguien.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: ruff
        run: ruff check .

      - name: pytest
        # Las pruebas crean repos git de verdad para poder comparar contra una revisión base.
        run: |
          set -euo pipefail
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          pytest -q

      - name: Los ejecutables quedaron instalados
        # Si un entry point se rompe, el fallo aparecería en el CI de los consumidores como un
        # "command not found" sin relación aparente con este repo.
        #
        # LOS CUATRO, no los que existían el día que se escribió esto. `[project.scripts]` declara
        # cuatro ejecutables y los cuatro se invocan desde el `contract-lint` de los repos
        # consumidores; comprobar solo dos dejaba fuera justo a los dos más nuevos, que son los que
        # tienen más probabilidad de tener el nombre del módulo mal escrito.
        run: |
          set -euo pipefail
          check-destructive --help > /dev/null
          gen-tables-lock --help > /dev/null
          set-github-org --help > /dev/null
          check-schemas --help > /dev/null

  workflows:
    name: los workflows son YAML válido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parsear cada workflow y verificar que declara workflow_call
        # Un error de sintaxis aquí no se descubre al mezclar: se descubre cuando un repo
        # consumidor lo llama y GitHub le contesta con un error que apunta a ESTE archivo.
        #
        # Y ADEMÁS: claves DUPLICADAS. `yaml.safe_load` acepta una clave repetida sin decir nada —
        # la última pisa a la primera. El 05/09/2026 una edición mal hecha duplicó el job
        # `workflows` entero en este mismo archivo, y el parseo siguió diciendo «YAML válido · 2
        # jobs»: el duplicado se había comido a su gemelo en silencio. En un workflow eso significa
        # que la mitad de lo que crees que corre no existe. Se comprueba con un loader propio
        # porque el de la librería, por diseño, no lo considera un error.
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path

          import yaml


          class SinDuplicados(yaml.SafeLoader):
              """Igual que SafeLoader, pero una clave repetida es un error y no un silencio."""


          def _sin_duplicados(loader, nodo, deep=False):
              mapa = {}
              for clave_nodo, valor_nodo in nodo.value:
                  clave = loader.construct_object(clave_nodo, deep=deep)
                  if clave in mapa:
                      raise yaml.constructor.ConstructorError(
                          None, None, f"clave duplicada: {clave!r}", clave_nodo.start_mark
                      )
                  mapa[clave] = loader.construct_object(valor_nodo, deep=deep)
              return mapa


          SinDuplicados.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, _sin_duplicados
          )

          fallos = []
          for archivo in sorted(Path(".github/workflows").glob("*.yml")):
              try:
                  datos = yaml.load(archivo.read_text(encoding="utf-8"), Loader=SinDuplicados)
              except yaml.YAMLError as exc:
                  fallos.append(f"{archivo}: YAML inválido: {exc}")
                  continue

              # `on` es la constante YAML `true` en YAML 1.1, que es lo que usa PyYAML.
              disparadores = datos.get("on") or datos.get(True) or {}
              if archivo.name.startswith("bundle-") and "workflow_call" not in disparadores:
                  fallos.append(f"{archivo}: es reutilizable pero no declara workflow_call")
              print(f"ok  {archivo}  ({', '.join(disparadores)})")

          if fallos:
              print("\n".join(fallos), file=sys.stderr)
              sys.exit(1)
          PY

      - name: La guarda de producción sigue en su sitio y sigue cubriendo prod
        # POR QUÉ ESTE CHECK ES UN PARSER Y NO UNA CORRIDA QUE FALLE.
        #
        # La guarda se VIO BLOQUEAR de verdad el 05/09/2026, y la evidencia es esta corrida:
        #   https://github.com/lynxdatalab/databricks-tooling/actions/runs/33982181990
        # `Producción no se despliega desde aquí = failure`, y checkout, setup-cli, bundle validate
        # y bundle deploy quedaron TODOS en `skipped`: no llegó a tocar un bundle.
        #
        # Esa corrida no se puede dejar puesta como check permanente: `continue-on-error` NO es
        # válido en un job que llama a un workflow reutilizable —GitHub rechaza el archivo entero,
        # no el job—, así que no hay forma de expresar «esto tiene que fallar» y seguir en verde. Y
        # un check permanentemente rojo entrena a ignorar los rojos.
        #
        # QUÉ VIGILA, Y QUÉ NO. Vigila la FORMA de la guarda, no su semántica: no ejecuta nada, así
        # que no puede saber si bloquea. La primera versión de este parser comprobaba que el paso
        # existiera, fuera el primero, su condición mencionara tres literales y su `run` contuviera
        # la subcadena `exit 1`. La revisión independiente del cierre encontró SEIS formas de
        # romper la guarda dejándolo en VERDE:
        #
        #   if: <expr> false && contains(...)       nunca corre; los tres literales siguen ahí
        #   continue-on-error: true en el paso       falla y el job SIGUE hasta el deploy
        #   exit 0 real, con exit 1 dentro de un echo    la subcadena estaba, la salida era 0
        #   condición negada: !contains(...)         bloquea dev y qa, deja pasar prod
        #   inputs.python-version en vez de target   mira el input equivocado
        #   exit 1 dentro de un if inalcanzable      nunca se ejecuta
        #
        # De ahí la forma de abajo: la condición se compara COMPLETA y literal, no por subcadenas,
        # y el `run` tiene que TERMINAR en `exit 1`. Eso hace el check deliberadamente frágil ante
        # cualquier edición de la guarda — que es lo que se quiere: cambiarla tiene que obligarte a
        # venir aquí y decidirlo, no colarse en un refactor.
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path

          import yaml

          ARCHIVO = Path(".github/workflows/bundle-deploy.yml")
          JOB = "deploy"
          PASO = "Producción no se despliega desde aquí"
          # La apertura de expresión va PARTIDA a propósito, y no es cosmético: GitHub interpola las
          # expresiones dentro de `run:` ANTES de ejecutar el shell, comentarios incluidos. Escribir
          # la condición entera aquí hace que GitHub intente evaluar `inputs.target` en un contexto
          # donde no existe, y rechaza EL ARCHIVO COMPLETO — el self-test muere sin correr ningún
          # job, con el mismo «workflow file issue» que no dice la causa. Ya pasó dos veces hoy.
          ABRE = "$" + "{{ "
          CIERRA = " }}"
          CONDICION = (
              ABRE
              + "contains(fromJSON('[\"prod\",\"production\"]'), inputs.target)"
              + " && !inputs.permitir-prod"
              + CIERRA
          )

          fallos: list[str] = []
          datos = yaml.safe_load(ARCHIVO.read_text(encoding="utf-8"))
          jobs = datos.get("jobs") or {}

          if JOB not in jobs:
              # Sin esto, renombrar el job reventaba con un KeyError crudo que no menciona la
              # guarda: quien lo viera en Actions no sabría de qué le hablan.
              print(
                  f"::error::{ARCHIVO} ya no tiene el job `{JOB}`, donde vive la guarda de "
                  f"producción. Jobs que hay: {sorted(jobs)}",
                  file=sys.stderr,
              )
              sys.exit(1)

          pasos = jobs[JOB].get("steps") or []
          guarda = next((p for p in pasos if p.get("name") == PASO), None)

          if guarda is None:
              fallos.append(
                  f"{ARCHIVO} ya no tiene el paso «{PASO}». Es la guarda que impide desplegar "
                  "producción desde el repo del proyecto, y se vio bloquear en la corrida "
                  "33982181990. Si se quitó a propósito, quita también este check y di por qué."
              )
          else:
              if pasos.index(guarda) != 0:
                  fallos.append(
                      "la guarda ya no es el PRIMER paso de `deploy`. Tiene que correr antes del "
                      "checkout y de cualquier credencial: es lo que hace que rechazar prod no "
                      "llegue a tocar un bundle."
                  )

              condicion = " ".join(str(guarda.get("if", "")).split())
              if condicion != " ".join(CONDICION.split()):
                  fallos.append(
                      "la condición de la guarda cambió. Se compara COMPLETA y no por subcadenas, "
                      "porque `false && ...`, una negación o mirar otro input dejan los literales "
                      "en su sitio y la guarda muerta. "
                      f"Esperada: {CONDICION} -- Está: {condicion} -- "
                      "Si el cambio es a propósito, actualiza CONDICION en este check."
                  )

              if guarda.get("continue-on-error"):
                  fallos.append(
                      "la guarda lleva `continue-on-error`, así que falla y el job SIGUE hasta el "
                      "deploy. Es peor que no tenerla: avisa y deja pasar."
                  )

              lineas = [x.strip() for x in str(guarda.get("run", "")).splitlines() if x.strip()]
              ultima = lineas[-1] if lineas else "(vacío)"
              if ultima != "exit 1":
                  fallos.append(
                      "el `run` de la guarda no TERMINA en `exit 1`. Se comprueba la última línea "
                      "y no que la subcadena aparezca: un `exit 1` dentro de un `echo` o de un "
                      f"`if` inalcanzable deja el paso en verde. Última línea: {ultima}"
                  )

          if fallos:
              for f in fallos:
                  print(f"::error::{f}", file=sys.stderr)
              sys.exit(1)

          print("ok  la guarda está, es el primer paso, su condición es la esperada,")
          print("    no lleva continue-on-error, y su run termina en exit 1")
          PY
