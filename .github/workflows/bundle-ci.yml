# Workflow reutilizable: valida un Databricks Asset Bundle sin desplegar nada.
#
# Se llama desde el CI de cada repo de lakehouse. Corre lint de Python, pruebas, el lint del
# contrato de dominios (si el repo lo tiene) y `databricks bundle validate` contra los targets que
# se le indiquen.
#
# NO despliega. La autenticación que usa es la de dev, y solo para que `bundle validate` pueda
# resolver referencias del workspace: no hay ningún paso que escriba.
#
# Uso desde el repo llamador:
#
#   jobs:
#     ci:
#       uses: <org>/databricks-tooling/.github/workflows/bundle-ci.yml@v1
#       permissions:
#         id-token: write     # ← lo otorga el LLAMADOR, no este archivo
#         contents: read
#       with:
#         targets: '["dev"]'

name: bundle-ci

on:
  workflow_call:
    inputs:
      targets:
        description: 'Targets del bundle a validar, como array JSON. Ej: ["dev","qa","prod"]'
        type: string
        default: '["dev"]'
      python-version:
        type: string
        default: "3.11"
      run-tests:
        description: Corre pytest si el repo tiene tests/.
        type: boolean
        default: true
      run-lint:
        description: Corre `ruff check .`. Se puede apagar en un repo que aún no está limpio.
        type: boolean
        default: true
      contract-lint:
        description: >-
          Comando del lint de contrato del repo. Vacío = se omite. Se ejecuta ANTES de bundle
          validate porque un contrato inválido hace fallar el pipeline en tiempo de ejecución, no
          en el deploy: es el error que más caro sale detectar tarde.
        type: string
        default: ""
      bundle-vars:
        description: >-
          Variables del bundle que no viven en databricks.yml, una por línea, en formato
          `nombre=valor`. Se exportan como BUNDLE_VAR_<nombre>, que es como el CLI las lee.

          Hace falta para toda variable declarada SIN default: sin ella, `bundle validate` falla
          con "no value assigned to required variable" en el CI de cada PR. El caso típico es el
          correo de alertas, que es un dato de operación y cambia sin que cambie el repo.

          El mapeo es explícito porque GitHub guarda los nombres de sus variables en MAYÚSCULAS y
          las del bundle distinguen mayúsculas: una copia directa exportaría
          BUNDLE_VAR_NOTIFICATION_EMAIL, que el CLI no reconoce.
        type: string
        default: ""
      environment:
        description: >-
          GitHub Environment del que salen DATABRICKS_HOST y DATABRICKS_CLIENT_ID. Debe ser uno
          SIN protection rules (dev): el CI corre en cada push y no puede quedarse esperando una
          aprobación.
        type: string
        default: dev
      destructive-check:
        description: >-
          Comando del análisis de cambios destructivos. Vacío = se omite.

          En un PR corre en modo `pr`: falla si el cambio borra recursos o deja tablas inactivas,
          a menos que el PR lleve la etiqueta correspondiente. Es la única compuerta que existe
          para el caso más frecuente —quitar tablas del pipeline— porque ese cambio NO le pide
          permiso al CLI: las tablas simplemente dejan de actualizarse y nadie se entera.

          El default es el ejecutable que instala `lakehouse-tooling`. Un repo que aún no lo use
          puede pasar aquí la ruta de su propio script.
        type: string
        default: "check-destructive"

jobs:
  destructivos:
    name: cambios destructivos
    # Solo en PRs: en un push a main el análisis lo hace el job `analizar` del deploy, que además
    # publica el resumen que ven los revisores de qa y prod.
    if: ${{ github.event_name == 'pull_request' && inputs.destructive-check != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Necesita la historia para leer el "antes" con `git show <base>:archivo`. Con
          # fetch-depth: 1 el check no puede distinguir "no cambió nada" de "no pude ver el antes".
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Sin `|| pip install pyyaml`: ese fallback convertía un pyproject roto en una corrida
          # verde que analizaba con las herramientas equivocadas.
          if [ -f pyproject.toml ]; then
            pip install -e '.[dev]'
          else
            pip install lakehouse-tooling
          fi

      - name: Analizar contra la rama base
        env:
          # Las etiquetas del PR son la salida explícita: ponerlas deja constancia de que fue una
          # decisión y no un descuido.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          ${{ inputs.destructive-check }} \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --mode pr \
            --labels "$PR_LABELS" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  estatico:
    name: lint + pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e '.[dev]'
          else
            pip install ruff pytest lakehouse-tooling
          fi

      - name: ruff
        if: inputs.run-lint
        run: ruff check .

      - name: pytest
        if: inputs.run-tests
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "Sin directorio tests/: se omite."
          fi

      - name: Lint del contrato
        if: inputs.contract-lint != ''
        run: ${{ inputs.contract-lint }}

  bundle:
    name: validate (${{ matrix.target }})
    needs: estatico
    runs-on: ubuntu-latest
    # Toma HOST y CLIENT_ID del environment. Se declara aunque no se despliegue porque es de donde
    # salen las variables y porque el claim `sub` del token OIDC tiene que coincidir con la
    # federation policy del service principal.
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      # Fijo, no @main: es la misma regla que este repo le impone a sus consumidores.
      - uses: databricks/setup-cli@v1.11.0

      # Mismo mecanismo que en bundle-deploy: las variables del bundle que no tienen default hay
      # que pasarlas, o `bundle validate` falla con "no value assigned to required variable" — y
      # fallaría en el CI de cada PR, no solo al desplegar.
      - name: Exportar variables del bundle
        if: inputs.bundle-vars != ''
        env:
          BUNDLE_VARS: ${{ inputs.bundle-vars }}
        run: |
          set -euo pipefail
          while IFS= read -r linea; do
            [ -z "${linea// }" ] && continue
            case "$linea" in \#*) continue ;; esac
            nombre=${linea%%=*}
            valor=${linea#*=}
            nombre=$(printf '%s' "$nombre" | tr -d '[:space:]')
            if [ -z "$nombre" ] || [ "$nombre" = "$linea" ]; then
              echo "::error::bundle-vars: '$linea' no tiene forma nombre=valor" && exit 1
            fi
            printf 'BUNDLE_VAR_%s=%s\n' "$nombre" "$valor" >> "$GITHUB_ENV"
            echo "  BUNDLE_VAR_$nombre exportada"
          done <<< "$BUNDLE_VARS"

      - name: databricks bundle validate
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          # Sin DATABRICKS_CLIENT_SECRET: la CLI usa el token OIDC efímero que emite GitHub y que
          # la federation policy del service principal canjea por acceso. No hay ningún secreto
          # de larga vida en el repo ni en los settings.
        run: databricks bundle validate -t ${{ matrix.target }}
