# Workflow reutilizable: valida un Databricks Asset Bundle sin desplegar nada.
#
# Se llama desde el CI de cada repo de lakehouse. Corre lint de Python, pruebas, el lint del
# contrato de dominios (si el repo lo tiene) y `databricks bundle validate` contra los targets que
# se le indiquen.
#
# NO despliega. La autenticación que usa es la de dev, y solo para que `bundle validate` pueda
# resolver referencias del workspace: no hay ningún paso que escriba.
#
# Uso desde el repo llamador:
#
#   jobs:
#     ci:
#       uses: <org>/databricks-tooling/.github/workflows/bundle-ci.yml@v1
#       permissions:
#         id-token: write     # ← lo otorga el LLAMADOR, no este archivo
#         contents: read
#       with:
#         targets: '["dev"]'

name: bundle-ci

on:
  workflow_call:
    inputs:
      targets:
        description: 'Targets del bundle a validar, como array JSON. Ej: ["dev","qa","prod"]'
        type: string
        default: '["dev"]'
      python-version:
        type: string
        default: "3.11"
      run-tests:
        description: Corre pytest si el repo tiene tests/.
        type: boolean
        default: true
      run-lint:
        description: Corre `ruff check .`. Se puede apagar en un repo que aún no está limpio.
        type: boolean
        default: true
      contract-lint:
        description: >-
          Comando del lint de contrato del repo. Vacío = se omite. Se ejecuta ANTES de bundle
          validate porque un contrato inválido hace fallar el pipeline en tiempo de ejecución, no
          en el deploy: es el error que más caro sale detectar tarde.
        type: string
        default: ""
      bundle-vars:
        description: >-
          Variables del bundle que no viven en databricks.yml, una por línea, en formato
          `variable_del_bundle=NOMBRE_DE_LA_VARIABLE_DE_GITHUB`. Se exportan como
          BUNDLE_VAR_<variable_del_bundle>, que es como el CLI las lee.

          Hace falta para toda variable declarada SIN default: sin ella, `bundle validate` falla
          con "no value assigned to required variable". El caso típico es el correo de alertas, un
          dato de operación que cambia sin que cambie el repo, y que no tiene default a propósito
          porque un default vacío produce un lote que falla de madrugada sin que nadie se entere.

          Se mandan NOMBRES y no valores porque el llamador no puede resolverlos: las variables de
          un GitHub Environment solo existen en el contexto `vars` de un job que declare ese
          environment, y quien lo declara es este workflow. Un `vars.X` escrito en el llamador se
          evalúa contra las variables del repo y llega vacío, sin error.

          El nombre del bundle se escribe aparte del de GitHub porque GitHub guarda los suyos en
          MAYÚSCULAS y las variables del bundle distinguen mayúsculas: copiarlas tal cual
          exportaría BUNDLE_VAR_NOTIFICATION_EMAIL, que el CLI no reconoce.

              bundle-vars: |
                notification_email=NOTIFICATION_EMAIL
        type: string
        default: ""
      environment:
        description: >-
          GitHub Environment del que salen DATABRICKS_HOST y DATABRICKS_CLIENT_ID. Debe ser uno
          SIN protection rules (dev): el CI corre en cada push y no puede quedarse esperando una
          aprobación.
        type: string
        default: dev
      destructive-check:
        description: >-
          Comando del análisis de cambios destructivos. Vacío = se omite.

          En un PR corre en modo `pr`: falla si el cambio borra recursos o deja tablas inactivas,
          a menos que el PR lleve la etiqueta correspondiente. Es la única compuerta que existe
          para el caso más frecuente —quitar tablas del pipeline— porque ese cambio NO le pide
          permiso al CLI: las tablas simplemente dejan de actualizarse y nadie se entera.

          El default es el ejecutable que instala `lakehouse-tooling`. Un repo que aún no lo use
          puede pasar aquí la ruta de su propio script.
        type: string
        default: "check-destructive"

jobs:
  destructivos:
    name: cambios destructivos
    # Solo en PRs: en un push a main el análisis lo hace el job `analizar` del deploy, que además
    # publica el resumen que ven los revisores de qa y prod.
    if: ${{ github.event_name == 'pull_request' && inputs.destructive-check != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Necesita la historia para leer el "antes" con `git show <base>:archivo`. Con
          # fetch-depth: 1 el check no puede distinguir "no cambió nada" de "no pude ver el antes".
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Sin `|| pip install pyyaml`: ese fallback convertía un pyproject roto en una corrida
          # verde que analizaba con las herramientas equivocadas.
          if [ -f pyproject.toml ]; then
            pip install -e '.[dev]'
          else
            pip install lakehouse-tooling
          fi

      - name: Analizar contra la rama base
        env:
          # Las etiquetas del PR son la salida explícita: ponerlas deja constancia de que fue una
          # decisión y no un descuido.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          ${{ inputs.destructive-check }} \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --mode pr \
            --labels "$PR_LABELS" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  estatico:
    name: lint + pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e '.[dev]'
          else
            pip install ruff pytest lakehouse-tooling
          fi

      - name: ruff
        if: inputs.run-lint
        run: ruff check .

      - name: pytest
        if: inputs.run-tests
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "Sin directorio tests/: se omite."
          fi

      - name: Lint del contrato
        if: inputs.contract-lint != ''
        run: ${{ inputs.contract-lint }}

  bundle:
    name: validate (${{ matrix.target }})
    needs: estatico
    runs-on: ubuntu-latest
    # Toma HOST y CLIENT_ID del environment. Se declara aunque no se despliegue porque es de donde
    # salen las variables y porque el claim `sub` del token OIDC tiene que coincidir con la
    # federation policy del service principal.
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      # Fijo, no @main: es la misma regla que este repo le impone a sus consumidores.
      - uses: databricks/setup-cli@v1.11.0

      # El llamador NO puede resolver estos valores. Las variables de un GitHub Environment solo
      # existen en el contexto `vars` de un job que declare ese environment, y quien lo declara es
      # ESTE workflow, no el que lo invoca: un `${{ vars.X }}` escrito allá se evalúa contra las
      # variables del repo y llega vacío, sin error. Por eso el llamador manda NOMBRES y la
      # resolución ocurre aquí.
      #
      # Se exporta a GITHUB_ENV y no dentro de un solo `run:` porque los valores los consumen
      # varios pasos; tenerlos en uno solo daría un validate verde seguido de un deploy que falla.
      - name: Exportar variables del bundle
        if: inputs.bundle-vars != ''
        env:
          BUNDLE_VARS: ${{ inputs.bundle-vars }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          disponibles = json.loads(os.environ["VARS_JSON"])
          destino = os.environ["GITHUB_ENV"]

          with open(destino, "a", encoding="utf-8") as fh:
              for cruda in os.environ["BUNDLE_VARS"].splitlines():
                  linea = cruda.strip()
                  if not linea or linea.startswith("#"):
                      continue
                  if "=" not in linea:
                      sys.exit(f"::error::bundle-vars: '{linea}' no tiene forma "
                               "variable_del_bundle=NOMBRE_DE_LA_VARIABLE_DE_GITHUB")
                  var_bundle, var_github = (p.strip() for p in linea.split("=", 1))
                  if var_github not in disponibles:
                      sys.exit(f"::error::bundle-vars: no existe una variable '{var_github}'. "
                               "Revisa Settings > Environments del repo que invoca este workflow.")
                  valor = disponibles[var_github]
                  if not valor:
                      sys.exit(f"::error::bundle-vars: la variable '{var_github}' está vacía, y "
                               f"'{var_bundle}' no tiene default en databricks.yml.")
                  if "\n" in valor:
                      sys.exit(f"::error::bundle-vars: '{var_github}' tiene saltos de línea.")
                  # El valor no se imprime: el log de una corrida puede ser público.
                  fh.write(f"BUNDLE_VAR_{var_bundle}={valor}\n")
                  print(f"  BUNDLE_VAR_{var_bundle} <- {var_github}")
          PY

      - name: databricks bundle validate
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          # Explícito, no por descubrimiento: con solo HOST y CLIENT_ID el CLI recorre su cadena de
          # credenciales, no encuentra ninguna completa y muere con "cannot configure default
          # credentials", sin mencionar que el token OIDC de GitHub estaba ahí para usarse.
          DATABRICKS_AUTH_TYPE: github-oidc
          # Sin DATABRICKS_CLIENT_SECRET: la CLI usa el token OIDC efímero que emite GitHub y que
          # la federation policy del service principal canjea por acceso. No hay ningún secreto
          # de larga vida en el repo ni en los settings.
        run: databricks bundle validate -t ${{ matrix.target }}
