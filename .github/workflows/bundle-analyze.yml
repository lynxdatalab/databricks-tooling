# Workflow reutilizable: analiza qué va a cambiar un despliegue y publica el resultado.
#
# POR QUÉ EXISTE COMO JOB APARTE
# GitHub evalúa las protection rules de un environment ANTES de ejecutar el primer paso del job.
# Un job con `environment: qa` se detiene en seco: no alcanza a imprimir nada, así que el revisor
# aprobaría a ciegas. Este job corre SIN environment, se ejecuta de inmediato, y deja el detalle en
# el resumen de la corrida — que es lo primero que se ve al abrirla.
#
# Los jobs de deploy dependen de él con `needs:`, así que para cuando qa y prod se detienen
# esperando aprobación, el análisis ya está publicado en esa misma corrida.
#
# No necesita credenciales de Databricks: compara declaraciones del repo (git), no el estado del
# workspace. Eso lo hace determinista y auditable — dos personas que miren el mismo commit ven lo
# mismo.

name: bundle-analyze

on:
  workflow_call:
    inputs:
      base-ref:
        description: Contra qué revisión se compara. En un push a main, el commit anterior.
        type: string
        default: ""
      check-command:
        description: >-
          Comando del análisis del repo. Debe aceptar --base, --mode, --summary-file y
          --output-file. Vacío = se omite el análisis (el proyecto todavía no lo tiene).

          El default es el ejecutable que instala `lakehouse-tooling`.
        type: string
        default: "check-destructive"
      contract-lint:
        description: >-
          Compuertas del repo, una por línea. Vacío = se omiten.

          POR QUÉ ESTÁN AQUÍ Y NO SOLO EN EL CI. `ci` y `deploy` son workflows INDEPENDIENTES:
          los dos se disparan por push a main y ninguno depende del otro. Un `ci` en rojo no
          impedía desplegar, así que toda compuerta que viviera solo allá era decorativa — el
          código llegaba al workspace igual.

          Este job es `needs:` de todos los jobs de despliegue, así que fallar aquí los detiene a
          todos. Se pasa la MISMA lista que a bundle-ci: en el PR avisa temprano, aquí bloquea.

          Corren ANTES del análisis de destructivos a propósito: si el contrato no es válido, lo
          que el análisis diga sobre él no significa nada.
        type: string
        default: ""
      python-version:
        type: string
        default: "3.11"
    outputs:
      destructive:
        description: "true si el cambio destruye o recrea recursos. Los jobs de deploy lo usan para etiquetarse."
        value: ${{ jobs.analizar.outputs.destructive }}
      orphaned:
        description: "true si el cambio deja tablas inactivas en el catálogo."
        value: ${{ jobs.analizar.outputs.orphaned }}

jobs:
  analizar:
    name: analizar cambios
    runs-on: ubuntu-latest

    outputs:
      destructive: ${{ steps.check.outputs.destructive }}
      orphaned: ${{ steps.check.outputs.orphaned }}

    steps:
      - uses: actions/checkout@v4
        with:
          # El análisis compara contra la revisión anterior, así que necesita historia. `0` trae
          # todo: con fetch-depth: 1 el `git show <base>:archivo` falla y el check no puede
          # distinguir "no cambió nada" de "no pude ver el antes" — el peor de los dos errores.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Sin `|| pip install pyyaml`: ese fallback convertía un pyproject roto en una corrida
          # verde que analizaba con las herramientas equivocadas.
          if [ -f pyproject.toml ]; then
            pip install -e '.[dev]'
          else
            pip install lakehouse-tooling
          fi

      # La compuerta que de verdad detiene un despliegue. Va antes del análisis de destructivos:
      # si el contrato no es válido, lo que el análisis diga sobre él no significa nada.
      - name: Compuertas del repo
        if: inputs.contract-lint != ''
        run: ${{ inputs.contract-lint }}

      # Resolver la base es un paso aparte porque tiene tres casos y uno de ellos no es un error.
      #
      # El que muerde: cuando un push CREA la rama, GitHub manda `before` = 40 ceros. No es cadena
      # vacía, así que un `||` lo da por bueno, y el fallo aparece después, dentro del análisis,
      # como "no se pudo resolver la revisión base 0000..." — un mensaje que no se parece en nada a
      # su causa. En un repo recién publicado eso deja rojo el primer deploy y, por `needs:`, deja
      # dev/qa/prod en skipped.
      - name: Resolver la revisión base
        id: base
        env:
          BASE_INPUT: ${{ inputs.base-ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          SHA_NULO=0000000000000000000000000000000000000000
          if [ -n "$BASE_INPUT" ]; then
            BASE="$BASE_INPUT"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "$SHA_NULO" ]; then
            BASE="$EVENT_BEFORE"
          elif git rev-parse --verify -q 'HEAD~1^{commit}' >/dev/null; then
            BASE=HEAD~1
          else
            # Primer commit del repositorio: no existe un "antes". No es un error a depurar.
            BASE=""
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

      - name: Analizar
        id: check
        if: inputs.check-command != '' && steps.base.outputs.ref != ''
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          ${{ inputs.check-command }} \
            --base "$BASE_REF" \
            --mode report \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --output-file "$GITHUB_OUTPUT"

      - name: Sin revisión previa
        if: inputs.check-command != '' && steps.base.outputs.ref == ''
        run: |
          {
            echo "### Análisis de cambios: sin revisión previa"
            echo ""
            echo "Este es el primer commit del repositorio, así que no hay un estado anterior"
            echo "contra el cual comparar. **Todo es nuevo**: por construcción, este despliegue"
            echo "no puede destruir ni dejar huérfano nada."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sin análisis configurado
        if: inputs.check-command == ''
        run: |
          {
            echo "### Análisis de cambios: no configurado"
            echo ""
            echo "Este repo no declara \`check-command\`, así que **no se verificó** si el"
            echo "despliegue destruye recursos o deja tablas inactivas."
            echo ""
            echo "Para activarlo, agrega \`lakehouse-tooling\` a las dependencias de desarrollo"
            echo "del repo y pasa \`check-command: check-destructive\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "destructive=false" >> "$GITHUB_OUTPUT"
          echo "orphaned=false" >> "$GITHUB_OUTPUT"
