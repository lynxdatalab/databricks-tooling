# Workflow reutilizable: analiza qué va a cambiar un despliegue y publica el resultado.
#
# POR QUÉ EXISTE COMO JOB APARTE
# GitHub evalúa las protection rules de un environment ANTES de ejecutar el primer paso del job.
# Un job con `environment: qa` se detiene en seco: no alcanza a imprimir nada, así que el revisor
# aprobaría a ciegas. Este job corre SIN environment, se ejecuta de inmediato, y deja el detalle en
# el resumen de la corrida — que es lo primero que se ve al abrirla.
#
# Los jobs de deploy dependen de él con `needs:`, así que para cuando qa y prod se detienen
# esperando aprobación, el análisis ya está publicado en esa misma corrida.
#
# No necesita credenciales de Databricks: compara declaraciones del repo (git), no el estado del
# workspace. Eso lo hace determinista y auditable — dos personas que miren el mismo commit ven lo
# mismo.

name: bundle-analyze

on:
  workflow_call:
    inputs:
      base-ref:
        description: Contra qué revisión se compara. En un push a main, el commit anterior.
        type: string
        default: ""
      check-command:
        description: >-
          Comando del análisis del repo. Debe aceptar --base, --mode, --summary-file y
          --output-file. Vacío = se omite el análisis (el proyecto todavía no lo tiene).
        type: string
        default: "python tools/check_destructive.py"
      python-version:
        type: string
        default: "3.11"
    outputs:
      destructive:
        description: "true si el cambio destruye o recrea recursos. Los jobs de deploy lo usan para etiquetarse."
        value: ${{ jobs.analizar.outputs.destructive }}
      orphaned:
        description: "true si el cambio deja tablas inactivas en el catálogo."
        value: ${{ jobs.analizar.outputs.orphaned }}

jobs:
  analizar:
    name: analizar cambios
    runs-on: ubuntu-latest

    outputs:
      destructive: ${{ steps.check.outputs.destructive }}
      orphaned: ${{ steps.check.outputs.orphaned }}

    steps:
      - uses: actions/checkout@v4
        with:
          # El análisis compara contra la revisión anterior, así que necesita historia. `0` trae
          # todo: con fetch-depth: 1 el `git show <base>:archivo` falla y el check no puede
          # distinguir "no cambió nada" de "no pude ver el antes" — el peor de los dos errores.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e '.[dev]' || pip install pyyaml; else pip install pyyaml; fi

      - name: Analizar
        id: check
        if: inputs.check-command != ''
        env:
          # En un push a main, el "antes" es el commit anterior. En workflow_dispatch no hay evento
          # previo, así que se cae a HEAD~1, que es lo mismo salvo en el primer commit del repo.
          BASE_REF: ${{ inputs.base-ref || github.event.before || 'HEAD~1' }}
        run: |
          set -euo pipefail
          ${{ inputs.check-command }} \
            --base "$BASE_REF" \
            --mode report \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --output-file "$GITHUB_OUTPUT"

      - name: Sin análisis configurado
        if: inputs.check-command == ''
        run: |
          {
            echo "### Análisis de cambios: no configurado"
            echo ""
            echo "Este repo no declara \`check-command\`, así que **no se verificó** si el"
            echo "despliegue destruye recursos o deja tablas inactivas."
            echo ""
            echo "Para activarlo, copia \`tools/check_destructive.py\` desde el template."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "destructive=false" >> "$GITHUB_OUTPUT"
          echo "orphaned=false" >> "$GITHUB_OUTPUT"
