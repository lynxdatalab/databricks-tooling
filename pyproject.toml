[project]
name = "lakehouse-tooling"
version = "1.0.0"
description = "Compuertas de CI y workflows reutilizables para los repos de lakehouse."
requires-python = ">=3.11"

# Mínimo a propósito: esto se instala en el CI de todos los repos consumidores, y cada dependencia
# que se agregue aquí es una que ellos no eligieron. yaml es inevitable —hay que leer los
# resources/*.yml del bundle—; todo lo demás sale de la librería estándar.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
check-destructive = "lakehouse_tooling.check_destructive:main"
gen-tables-lock = "lakehouse_tooling.tables_lock:main"
set-github-org = "lakehouse_tooling.github_org:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_tooling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
